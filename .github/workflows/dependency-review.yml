name: Dependency Review

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-24.04
    # Dependency review requires GitHub Advanced Security on private repos, so
    # this stays disabled while the repository is private and auto-enables when public.
    if: github.repository_visibility == 'public'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/dependency-review-action@e58c696e52cac8e62d61cc21fda89565d71505d7 # v4.3.1
        with:
          fail-on-severity: high
