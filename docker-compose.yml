services:
  api:
    restart: unless-stopped
    container_name: paw-hono-api
    image: paw-hono-api:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
    env_file:
      - .env
